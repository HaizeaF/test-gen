[project]
name = "test-gen"
version = "0.1.0"
description = "A quiz app for exam preparation with built-in analytics on study habits, weak spots and retention."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.6,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "plotly (>=7.1.0,<8.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.2,<0.18.0)",
    "httpx2 (>=2.16.0,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 130
extend-exclude = ["src/backend/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]