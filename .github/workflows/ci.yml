name: Tests

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Poetry
      uses: abatilo/actions-poetry@v4  

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: 'poetry'

    - name: Install dependencies
      run: poetry install

    - name: Test with pytest
      run: poetry run pytest
